<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duhoe Kim</title>
    <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkbg dark:text-gray-200 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // [Icons Component]
        // ==========================================
        const IconBase = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Mail: (props) => <IconBase {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconBase>,
            Github: (props) => <IconBase {...props}><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></IconBase>,
            Linkedin: (props) => <IconBase {...props}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></IconBase>,
            BookOpen: (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>,
            GraduationCap: (props) => <IconBase {...props}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconBase>,
            Briefcase: (props) => <IconBase {...props}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconBase>,
            MapPin: (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>,
            Moon: (props) => <IconBase {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>,
            Sun: (props) => <IconBase {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41-1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>,
            FileText: (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></IconBase>,
            Code: (props) => <IconBase {...props}><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></IconBase>,
            Bell: (props) => <IconBase {...props}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></IconBase>
        };

        // ==========================================
        // [DATA SECTION]
        // ==========================================
        const DATA = {
            profile: {
                name: "Duhoe Kim",
                englishName: "Duhoe Kim",
                title: "(Admitted) Integrated Ph.D",
                affiliation: "PI-Lab, Seoul National University",
                email: "goat2001@cau.ac.kr",
                github: "https://github.com/dubae/",
                linkedin: "#", 
                cv: "#", 
                location: "Seoul, South Korea",
                // Placeholder image logic handled in component
                image: "images/duhoe.png", 
                // [Updated] Bio with hyperlinks
                bio: (
                    <>
                        I am an incoming Integrated Ph.D. student at <a href="https://pi.snu.ac.kr/" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">PI-Lab</a>, <a href="https://en.snu.ac.kr/index.html" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">Seoul National University</a>, advised by <a href="https://yj-yu.github.io/home/" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">Youngjae Yu</a>. 
                        <br className="block my-2" />
                        I received my B.S. in Computer Science and Engineering from <a href="https://neweng.cau.ac.kr/index.do" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">Chung-Ang University</a> in 2025, graduating summa cum laude. 
                        <br className="block my-2" />
                        My research interests include Generative Models, Deep Learning Architectures, and VLMs.
                    </>
                )
            },
            news: [
                { date: "FEB 2026", content: "Joined SNU PI-Lab as M.S.–Ph.D. Integrated Program (incoming)." },
                { date: "AUG 2025", content: "Graduated from CSE, CAU (Summa Cum Laude)." },
            ],
            education: [
                {
                    degree: "M.S./Ph.D in Artificial Intelligence (incoming)",
                    // [Updated] School with link
                    school: <a href="https://en.snu.ac.kr/index.html" target="_blank" rel="noopener noreferrer" className="hover:text-primary hover:underline">Seoul National University</a>,
                    period: "Feb 2026 - Current",
                    // [Updated] Advisor with link
                    description: (
                        <>Advisor: <a href="https://yj-yu.github.io/home/" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">Prof. Youngjae Yu</a></>
                    ),
                    details: []
                },
                {
                    degree: "B.S. in Computer Science and Engineering",
                    // [Updated] School with link
                    school: <a href="https://neweng.cau.ac.kr/index.do" target="_blank" rel="noopener noreferrer" className="hover:text-primary hover:underline">Chung-Ang University</a>,
                    period: "Feb 2020 - Aug 2025",
                    description: "Summa Cum Laude",
                    details: [
                        "GPA: 4.34 / 4.5", 
                        "Major GPA: 4.46 / 4.5"
                    ]
                }
            ],
            experience: [
                {
                    role: "Research Intern",
                    // [Updated] Company with link
                    company: <a href="https://jaesik.info/lab" target="_blank" rel="noopener noreferrer" className="hover:text-primary hover:underline">Visual & Geometry Intelligence Lab, Seoul National University</a>,
                    period: "Jan 2025 - DEC 2025 (Expected)",
                    // [Updated] Advisor with link
                    description: (
                        <>Advisor: <a href="https://jaesik.info" target="_blank" rel="noopener noreferrer" className="font-medium text-primary hover:underline">Prof. Jaesik Park</a></>
                    ),
                    details: []
                }
            ],
            publications: [
                {
                    title: "Reproducible Consistency Training via Improved Self-Distillation Guidance",
                    authors: "********** ***, Duhoe Kim, ******* ***, ****** ****",
                    venue: "Under Review",
                    year: "2025",
                    description: "Improved Self-Distillation(iSD) for flow map models to ensure convergence to the global optimum by exploring the design space and reducing reliance on heuristics.",
                    links: [
                        { name: "PDF", url: "", icon: "pdf" } 
                    ],
                    tags: ["Flow Models", "Self-Distillation", "Generative Models"]
                }
            ]
        };

        // ==========================================
        // [Components] 
        // ==========================================

        const Section = ({ title, icon: Icon, children }) => (
            <section className="mb-12 animate-fade-in">
                <div className="flex items-center gap-2 mb-6 border-b border-gray-200 dark:border-gray-700 pb-2">
                    {Icon && <Icon className="w-6 h-6 text-primary" />}
                    <h2 className="text-2xl font-bold text-gray-800 dark:text-white">{title}</h2>
                </div>
                {children}
            </section>
        );

        const Badge = ({ text }) => (
            <span className="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 mr-2">
                {text}
            </span>
        );

        const NewsItem = ({ date, content }) => (
            <div className="flex flex-col sm:flex-row gap-1 sm:gap-4 text-sm mb-3 last:mb-0">
                <span className="font-mono font-bold text-gray-500 dark:text-gray-400 shrink-0 w-24">{date}</span>
                <span className="text-gray-700 dark:text-gray-300 leading-relaxed">{content}</span>
            </div>
        );

        const PublicationItem = ({ pub, myName }) => {
            const formattedAuthors = pub.authors.split(', ').map((author, idx, arr) => {
                const isMe = author.trim() === myName;
                return (
                    <span key={idx} className={isMe ? "font-bold text-gray-900 dark:text-white underline decoration-primary decoration-2 underline-offset-2" : ""}>
                        {author}
                        {idx < arr.length - 1 ? ", " : ""}
                    </span>
                );
            });

            return (
                <div className="mb-8 group">
                    <div className="flex flex-col sm:flex-row sm:items-baseline justify-between mb-1">
                        <h3 className="text-lg font-semibold text-gray-900 dark:text-gray-100 group-hover:text-primary transition-colors">
                            {pub.title}
                        </h3>
                        <span className="text-sm font-mono text-gray-500 dark:text-gray-400 shrink-0">{pub.year}</span>
                    </div>
                    <p className="text-gray-700 dark:text-gray-300 text-sm mb-1 leading-relaxed">
                        {formattedAuthors}
                    </p>
                    <p className="text-sm text-gray-600 dark:text-gray-400 italic mb-2">
                        {pub.venue}
                    </p>
                    {pub.description && (
                        <p className="text-sm text-gray-600 dark:text-gray-300 mt-2 mb-3 leading-relaxed">
                            {pub.description}
                        </p>
                    )}
                    <div className="flex flex-wrap items-center gap-3 mt-2">
                        {pub.tags && pub.tags.map((tag, i) => <Badge key={i} text={tag} />)}
                        <div className="flex gap-3 ml-auto">
                            {pub.links.map((link, i) => (
                                <a 
                                    key={i} 
                                    href={link.url}
                                    className="flex items-center gap-1 text-xs font-medium px-2 py-1 border border-gray-300 dark:border-gray-600 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                                >
                                    {link.icon === 'pdf' ? <Icons.FileText size={12} /> : <Icons.Github size={12} />}
                                    {link.name}
                                </a>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const TimelineItem = ({ data }) => (
            <div className="mb-8 relative pl-6 border-l-2 border-gray-200 dark:border-gray-700 last:mb-0">
                <div className="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-white dark:bg-darkcard border-2 border-primary"></div>
                <div className="flex flex-col sm:flex-row sm:justify-between sm:items-baseline mb-1">
                    <h3 className="text-lg font-bold text-gray-900 dark:text-gray-100">{data.role || data.degree}</h3>
                    <span className="text-sm font-mono text-gray-500 dark:text-gray-400">{data.period}</span>
                </div>
                <div className="text-md font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {data.company || data.school}
                </div>
                <div className="text-sm text-gray-600 dark:text-gray-400 mb-2">
                    {data.description}
                </div>
                {data.details && data.details.length > 0 && (
                    <ul className="list-disc list-inside text-sm text-gray-600 dark:text-gray-400 space-y-1">
                        {data.details.map((detail, idx) => (
                            <li key={idx}>{detail}</li>
                        ))}
                    </ul>
                )}
            </div>
        );

        const ThemeToggle = () => {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                }
            }, []);

            const toggleTheme = () => {
                setIsDark(!isDark);
                document.documentElement.classList.toggle('dark');
            };

            return (
                <button 
                    onClick={toggleTheme}
                    className="fixed top-4 right-4 z-50 p-2 rounded-full bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition-all border border-gray-200 dark:border-gray-700"
                    aria-label="Toggle Theme"
                >
                    {isDark ? <Icons.Sun size={20} className="text-yellow-500" /> : <Icons.Moon size={20} className="text-gray-600" />}
                </button>
            );
        };

        const Sidebar = ({ profile }) => (
            <aside className="md:w-1/3 lg:w-1/4 p-8 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-gray-800 flex flex-col md:fixed md:h-screen md:overflow-y-auto hide-scrollbar">
                <div className="flex flex-col items-center md:items-start text-center md:text-left">
                    <div className="w-40 h-40 mb-6 rounded-full overflow-hidden border-4 border-gray-100 dark:border-gray-700 shadow-lg bg-gray-100">
                        <img 
                            src={profile.image} 
                            alt={profile.name} 
                            className="w-full h-full object-cover"
                            onError={(e) => {e.target.src = "https://api.dicebear.com/7.x/avataaars/svg?seed=Duhoe&backgroundColor=b6e3f4"}} 
                        />
                    </div>
                    
                    <h1 className="text-3xl font-bold text-gray-900 dark:text-white mb-1 tracking-tight">{profile.name}</h1>
                    
                    <div className="space-y-2 my-6 w-full">
                        <div className="flex items-center justify-center md:justify-start gap-2 text-gray-600 dark:text-gray-400 text-sm">
                            <Icons.Briefcase size={16} />
                            <span>{profile.title}</span>
                        </div>
                        <div className="flex items-center justify-center md:justify-start gap-2 text-gray-600 dark:text-gray-400 text-sm">
                            <Icons.GraduationCap size={16} />
                            <span>{profile.affiliation}</span>
                        </div>
                        <div className="flex items-center justify-center md:justify-start gap-2 text-gray-600 dark:text-gray-400 text-sm">
                            <Icons.MapPin size={16} />
                            <span>{profile.location}</span>
                        </div>
                    </div>

                    <div className="flex gap-4 mb-8 justify-center md:justify-start w-full">
                        <a href={`mailto:${profile.email}`} className="p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-primary hover:text-white dark:hover:bg-primary transition-all" title="Email">
                            <Icons.Mail size={20} />
                        </a>
                        <a href={profile.github} target="_blank" rel="noopener noreferrer" className="p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-800 hover:text-white dark:hover:bg-black transition-all" title="Github">
                            <Icons.Github size={20} />
                        </a>
                        <a href={profile.linkedin} target="_blank" rel="noopener noreferrer" className="p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-blue-700 hover:text-white transition-all" title="LinkedIn">
                            <Icons.Linkedin size={20} />
                        </a>
                         <a href={profile.cv} target="_blank" rel="noopener noreferrer" className="p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-green-600 hover:text-white transition-all" title="Download CV">
                            <Icons.FileText size={20} />
                        </a>
                    </div>
                </div>

                <div className="border-t border-gray-200 dark:border-gray-700 pt-6 hidden md:block">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">About Me</h3>
                    <div className="text-sm text-gray-600 dark:text-gray-300 leading-relaxed whitespace-pre-line">
                        {profile.bio}
                    </div>
                </div>
            </aside>
        );

        const App = () => {
            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <ThemeToggle />
                    
                    {/* Left Sidebar */}
                    <Sidebar profile={DATA.profile} />

                    {/* Mobile Bio */}
                    <div className="md:hidden p-8 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-gray-800">
                         <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">About Me</h3>
                        <div className="text-sm text-gray-600 dark:text-gray-300 leading-relaxed whitespace-pre-line">
                            {DATA.profile.bio}
                        </div>
                    </div>

                    {/* Right Content Area */}
                    <main className="md:w-2/3 lg:w-3/4 md:ml-auto">
                        <div className="p-6 md:p-16 max-w-4xl mx-auto">
                            
                            <Section title="News" icon={Icons.Bell}>
                                <div className="flex flex-col">
                                    {DATA.news.map((item, index) => (
                                        <NewsItem key={index} date={item.date} content={item.content} />
                                    ))}
                                </div>
                            </Section>

                            <Section title="Education" icon={Icons.GraduationCap}>
                                <div className="space-y-2">
                                    {DATA.education.map((edu, index) => (
                                        <TimelineItem key={index} data={edu} />
                                    ))}
                                </div>
                            </Section>

                            <Section title="Experience" icon={Icons.Briefcase}>
                                <div className="space-y-2">
                                    {DATA.experience.map((exp, index) => (
                                        <TimelineItem key={index} data={exp} />
                                    ))}
                                </div>
                            </Section>

                            <Section title="Publications" icon={Icons.BookOpen}>
                                <div className="flex flex-col">
                                    {DATA.publications.map((pub, index) => (
                                        <PublicationItem key={index} pub={pub} myName={DATA.profile.englishName} />
                                    ))}
                                </div>
                            </Section>

                            <footer className="mt-20 pt-6 border-t border-gray-200 dark:border-gray-700 text-center md:text-left text-sm text-gray-400">
                                <p>&copy; {new Date().getFullYear()} {DATA.profile.name}. All rights reserved.</p>
                                <p className="mt-1 text-xs">Built with React & Tailwind CSS</p>
                            </footer>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
